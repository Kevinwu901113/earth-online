# Standalone production stack; do not merge with the development compose files.
name: earth-online
x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    DATABASE_URL: postgres://earth:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/earth_online
    REDIS_URL: redis://redis:6379
  init: true
  stop_grace_period: 30s
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: earth_online
      POSTGRES_USER: earth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earth -d earth_online"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging
  migrate:
    <<: *app
    command: ["node", "src/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
  api:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 6
  worker:
    <<: *app
    command: ["node", "src/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
