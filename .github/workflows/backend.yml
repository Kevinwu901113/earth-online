name: Backend and frontend acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: earth
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: earth_online_test
        ports: ['55432:5432']
        options: --health-cmd 'pg_isready -U earth' --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://earth:test-only@127.0.0.1:55432/earth_online_test
      TEST_REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results
